# Netlify: regenera index.html desde content.js y publica solo los archivos del sitio.
[build]
  command = "node build.mjs && rm -rf dist && mkdir dist && cp index.html styles.css app.js favicon.svg robots.txt sitemap.xml dist/"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
